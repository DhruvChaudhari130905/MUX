[project]
name = "mux-server"
version = "0.1.0"
description = "MUX backend: room actors, coordinator, coder loop, and API."
requires-python = ">=3.11"
# Pin versions during week 1 setup.
dependencies = [
  "python-multipart>=0.0.9",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "openai",
  "tavily-python",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pyjwt",
  "aiosqlite",
  "httpx",
  # Syntax check of the JS/TS the coder writes (mux.agents.coder.tools.codecheck)
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "cryptography",
  "contree-sdk",
  # MCP servers' tools for the coder (mux.mcp); httpx2 is the HTTP client its transport takes
  "mcp>=2.3,<3",
  "httpx2",
  # SKILL.md frontmatter (mux.skills)
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the 'mux' package ships; docker/, migrations/ and scripts/ stay out of the wheel.
[tool.setuptools.packages.find]
include = ["mux*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: requires real Docker and the mux-sandbox image (run via make test-docker)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
